apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      imagePullSecrets:
        - name: argo-secret
      containers:
        - name: nginx
          image: harbor-dw.cowave.kr/argocd-dev/nginx:1.29.0
          ports:
            - containerPort: 80
